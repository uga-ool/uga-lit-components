<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receivables Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://design.online.uga.edu/css/base.css">
  <style>
    .obj-container {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    .obj-container h1 {
      color: #ba0c2f;
      border-bottom: 3px solid #ba0c2f;
      padding-bottom: 1rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #ba0c2f;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="obj-container">
    <header>
      <h1>Receivables Quiz</h1>
      <p><strong>For instructional designers:</strong> Add <code>&lt;script type="module" src="/shared/ugaonline/js/uga-components.js"&gt;&lt;/script&gt;</code> before <code>&lt;/body&gt;</code>. See <a href="../setup.html">Setup &amp; Usage</a>. This demo loads questions from <code>quiz10.json</code> in this folder via <code>type="local"</code> (from the repo root demo page use <code>quiz/quiz10.json</code>).</p>
    </header>

    <section>
      <uga-quiz
        quiz-id="quiz10-receivables"
        quiz-title="Receivables Quiz"
        passing-score="70"
        allow-retry="true"
        max-attempts="99"
        show-feedback="true"
        type="local"
        filename="quiz10.json">
      </uga-quiz>
    </section>
  </div>

  <script type="module" src="/shared/ugaonline/js/uga-components.js"></script>
  <script src="https://design.online.uga.edu/js/scripts.js" defer></script>
</body>
</html>
